# Tidewrack: a tiny original demo game in the banded-outcome family.
# Fiction-triggered moves, GM-never-rolls, consequence tables for partials and
# misses. Exists to prove the kernel runs a second family unchanged.
meta:
  id: tidewrack
  version: 0.1.0
  extends: core.banded@0.1.0
  name: Tidewrack (demo)
  license: CC0-1.0
  attribution_text: "Tidewrack demo rules, original to Table of The Basilisk (CC0)."
  kernel_compat: ">=0.1,<0.2"

rules_text:
  mode: inline
  full_text: |
    TIDEWRACK (demo)
    Stats run -1 to +2: Iron, Tide, Salt, Ember. The GM never rolls.
    When the weather of the story shifts, the GM turns over an omen card.
    When the fiction triggers a move, roll 2d6 + stat: 10+ full success,
    7-9 success with a cost, 6- the GM makes a hard move.
    Harm has four boxes; filling it leaves you Battered until you Mend.
    Hope (start 2, max 5) can be spent to Steady yourself, clearing harm.

vocabulary:
  iron: {label: Iron}
  tide: {label: Tide}
  salt: {label: Salt}
  ember: {label: Ember}
  grit: {label: Grit}
  strain: {label: Harm}

randomizers:
  dice_grammar:
    operators: [sum]
  # The omen deck: the GM turns one over when the weather of the story shifts.
  # Played-out omens come back only when the deck runs dry.
  decks:
    - id: omens
      reshuffle_rule: when_empty
      cards:
        - {id: gull, label: A gull circles}
        - {id: squall, label: A squall line}
        - {id: flat_calm, label: Flat calm}
        - {id: wreckage, label: Wreckage in the water}
        - {id: beacon, label: A beacon ashore}

entity_model:
  stats:
    - {id: iron, range: [-1, 2], default: 0}
    - {id: tide, range: [-1, 2], default: 0}
    - {id: salt, range: [-1, 2], default: 0}
    - {id: ember, range: [-1, 2], default: 0}
  resources:
    - id: grit
      min: 0
      max: "6"
      on_zero:
        - {primitive: add_condition, target: self, condition: battered}
  tracks:
    - id: strain
      boxes: 4
      on_fill:
        - {primitive: add_condition, target: self, condition: battered}
  # What counts as harm, for systems that need to know (lethality, metrics, the
  # overlay, fudging's "unearned death"). The mechanics stay on each target.
  harm: {targets: [grit, strain]}
  conditions:
    - {id: rattled, modifier: -1, duration: scene}
    - {id: battered, modifier: -2, duration: until_removed}
  # Stat blocks the GM spawns by id (ARCHITECTURE §2.3, §1.3.2).
  templates:
    - {id: reef_raider, label: "Reef raider", stats: {iron: 1, tide: 1}, resources: {grit: 5}, tags: [raider]}
    - {id: broken_mast, label: "Broken mast", kind: prop, tags: [splintered]}

resolution:
  situational_tags:
    - {id: storm, value: -1, derive: "scene.storm"}
    - {id: outnumbered, value: -1}
    - {id: prepared, value: 1}

actions:
  - id: defy_danger
    trigger: fiction
    stat: tide
    procedure: banded_roll
    eligibility: "scene.danger == 1"
    outcome_effects:
      partial: [{primitive: request_gm_ruling, table: costs}]
      miss: [{primitive: request_gm_ruling, table: hard_moves}]
  - id: face_down
    annotation_categories: [pressure, odds]
    trigger: fiction
    target: entity
    stat: iron
    procedure: banded_roll
    eligibility: "scene.encounter == 1"
    outcome_effects:
      full: [{primitive: modify_resource, target: target, resource: grit, amount: -2}]
      partial:
        - {primitive: modify_resource, target: target, resource: grit, amount: -1}
        - {primitive: request_gm_ruling, table: costs}
      miss: [{primitive: request_gm_ruling, table: hard_moves}]
  - id: read_the_waters
    trigger: fiction
    stat: salt
    procedure: banded_roll
    eligibility: "1"
    outcome_effects:
      full: [{primitive: earn_currency, target: actor, currency: hope, amount: 1}]
      partial:
        - {primitive: earn_currency, target: actor, currency: hope, amount: 1}
        - {primitive: request_gm_ruling, table: costs}
      miss: [{primitive: request_gm_ruling, table: hard_moves}]
  - id: mend
    trigger: declared
    stat: ember
    procedure: banded_roll
    requires: "scene.encounter == 0"
    outcome_effects:
      full:
        - {primitive: clear_track, target: actor, track: strain}
        - {primitive: remove_condition, target: actor, condition: battered}
      partial:
        - {primitive: mark_track, target: actor, track: strain, amount: -1}
        - {primitive: remove_condition, target: actor, condition: battered}
      miss: [{primitive: request_gm_ruling, table: hard_moves}]
  - id: steady
    trigger: declared
    procedure: automatic
    cost: {currency: hope, amounts: [1, 2, 3], range: [1, 3]}
    outcome_effects:
      pass:
        - {primitive: mark_track, target: actor, track: strain, amount: "-{spent}"}

gm:
  meta_currencies:
    - {id: hope, holder: each_player, start: 2, max: 5}
  consequence_tables:
    - id: costs
      entries:
        - {id: take_a_knock, label: "It costs you blood", weight: 2, severity: 2,
           effects: [{primitive: mark_track, target: actor, track: strain, amount: 1}]}
        - {id: lose_footing, label: "You are shaken", weight: 2, severity: 1,
           effects: [{primitive: add_condition, target: actor, condition: rattled}]}
        - {id: worn_down, label: "It wears you down", weight: 1, severity: 2,
           effects: [{primitive: modify_resource, target: actor, resource: grit, amount: -1}]}
    - id: hard_moves
      entries:
        - {id: deal_harm, label: "The sea hits hard", weight: 2, severity: 3,
           effects: [{primitive: mark_track, target: actor, track: strain, amount: 2}]}
        - {id: separate, label: "You are thrown and shaken", weight: 2, severity: 2,
           effects: [{primitive: add_condition, target: actor, condition: rattled},
                     {primitive: mark_track, target: actor, track: strain, amount: 1}]}
        - {id: grind, label: "It grinds you down", weight: 1, severity: 2,
           effects: [{primitive: modify_resource, target: actor, resource: grit, amount: -2}]}

chargen:
  steps:
    - id: playbook
      kind: choice
      unique_per_table: true
      options:
        - {id: warden, label: Warden, stats: {iron: 2, tide: 1, salt: 0, ember: -1}}
        - {id: reaver, label: Reaver, stats: {iron: 1, tide: 2, salt: -1, ember: 0}}
        - {id: tidecaller, label: Tidecaller, stats: {iron: -1, tide: 1, salt: 2, ember: 0}}
        - {id: salter, label: Salter, stats: {iron: 0, tide: 0, salt: 1, ember: 2}}
        - {id: lamplighter, label: Lamplighter, stats: {iron: 0, tide: -1, salt: 2, ember: 1}}
    - {id: detail, kind: table, table: detail_table}

# Tidewrack has no maps: distance is a band between two people, closest first
# (RangeBands, §1.4). The tactical profile talks about pressure and the odds.
spatial:
  backends: [range_bands]
  bands:
    - {id: close, label: Close}
    - {id: near, label: Near}
    - {id: far, label: Far}
  tactical_profile:
    categories:
      - {id: pressure, order: 1}
      - {id: odds, order: 2}
    weights: {threats_here: 2, allies_here: 2, closer: 1}
    factors:
      - {id: not_alone, applies_to: move, when: "allies_here >= threats_here and threats_here > 0", weight: 2}
      - {id: face_a_foe, applies_to: action, actions: [face_down], when: "target_threat == 1", weight: 3}
    annotation_templates:
      - {id: into_it, applies_to: move, category: pressure, when: "threats_here > 0", text: "into the thick of it with {threats_here}"}
      - {id: outmatched, applies_to: move, category: odds, when: "threats_here > allies_here + 1", text: "outnumbered there"}
      - {id: stare, applies_to: action, category: pressure, when: "threats_here > 0", text: "{target} is right in front of you"}
      - {id: long_odds, applies_to: action, category: odds, when: "target.grit > 4", text: "{target} still has plenty of fight"}

# Marks (ARCHITECTURE §2.3, BUILD_PLAN P0.15): mark one on every miss or failed
# roll; each threshold reached is one advance to choose.
progression:
  model: marks
  awards:
    - {when: outcome, outcomes: [miss, fail], amount: 1}
  thresholds: [3, 6, 10, 15]
  advances:
    - {id: tempered, label: "Tempered (+1 Iron)", stats: {iron: 1}}
    - {id: tidewise, label: "Tidewise (+1 Tide)", stats: {tide: 1}}
    - {id: weathered, label: "Weathered (+1 Salt)", stats: {salt: 1}}
    - {id: kindled, label: "Kindled (+1 Ember)", stats: {ember: 1}}

presentation:
  nameplate_resources: [grit]
  sheet:
    public: [strain]  # the table sees the harm you carry
  rule_cards:
    defy_danger: {title: Defy Danger, summary: "When you act despite a threat, roll +Tide.", category: action, icon_id: wave}
    face_down: {title: Face Down, summary: "When you stand against a foe, roll +Iron.", category: action, icon_id: shield}
    read_the_waters: {title: Read the Waters, summary: "When you study what is coming, roll +Salt.", category: action, icon_id: eye}
    mend: {title: Mend, summary: "Out of danger, roll +Ember to tend your wounds.", category: action, icon_id: needle}
    steady: {title: Steady, summary: "Spend Hope to clear one Harm per point.", category: action, icon_id: anchor}
    rattled: {title: Rattled, summary: "-1 to rolls until the scene ends.", category: condition, icon_id: shaken}
    battered: {title: Battered, summary: "-2 to rolls until you Mend.", category: condition, icon_id: crack}
    hope: {title: Hope, summary: "Spend to Steady yourself; max 5.", category: currency, icon_id: light}
    storm: {title: Storm, summary: "-1, applied automatically in a storm.", category: tag, icon_id: storm}
    outnumbered: {title: Outnumbered, summary: "-1 when facing more foes than friends.", category: tag, icon_id: crowd}
    prepared: {title: Prepared, summary: "+1 when you planned for exactly this.", category: tag, icon_id: plus}
